<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="counter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2dfb8"/>
      <stop offset="0.55" stop-color="#d9bb82"/>
      <stop offset="1" stop-color="#b68143"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b482b"/>
      <stop offset="0.5" stop-color="#b86d36"/>
      <stop offset="1" stop-color="#6e351f"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f1dc"/>
      <stop offset="0.45" stop-color="#b9c8c2"/>
      <stop offset="1" stop-color="#617a76"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fb6ad"/>
      <stop offset="1" stop-color="#176b6e"/>
    </linearGradient>
    <linearGradient id="darkMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#556164"/>
      <stop offset="1" stop-color="#252b2e"/>
    </linearGradient>
    <radialGradient id="griddle" cx="50%" cy="40%" r="68%">
      <stop offset="0" stop-color="#454a4b"/>
      <stop offset="0.7" stop-color="#272b2d"/>
      <stop offset="1" stop-color="#17191a"/>
    </radialGradient>
    <pattern id="grain" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M0 8 C7 2 18 13 28 6 M2 22 C11 15 17 27 28 20" fill="none" stroke="#ffffff" stroke-opacity=".055" stroke-width="2"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#20170f" flood-opacity=".42"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <style>
      .ol{stroke:#3a2118;stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
      .ol4{stroke:#3a2118;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
      .brass{fill:#dca943;stroke:#51331c;stroke-width:4}
      .label{font-family:'Microsoft YaHei UI','Microsoft YaHei',sans-serif;font-weight:800;fill:#fff3d0;paint-order:stroke;stroke:#3a2118;stroke-width:5;stroke-linejoin:round}
      .small{font-family:'Microsoft YaHei UI','Microsoft YaHei',sans-serif;font-weight:700;fill:#3b2418}
      .measure{font-family:'Microsoft YaHei UI','Microsoft YaHei',sans-serif;font-weight:900;fill:#fff5cf;letter-spacing:2px}
      .guide{stroke:#63e3d1;stroke-width:3;stroke-dasharray:10 8;fill:none;opacity:.9}
    </style>
  </defs>


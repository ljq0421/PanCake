[preset.0]

name="Demo Pilot Windows"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features="demo_pilot"
export_filter="all_resources"
include_filter="Data/Demo/*.json,Data/Localization/*.json,resource/fonts/KNMaiyuan/OFL.txt"
exclude_filter="docs/*,tools/*,Scenes/Tests/*,Scripts/Tests/*,.tmp/*,output/*,artifacts/*,resource/fonts/preview/*"
export_path="output/demo-pilot/BreakfastDemo.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=".tmp/demo-implementation/export-templates/windows_debug_x86_64.exe"
custom_template/release=".tmp/demo-implementation/export-templates/windows_release_x86_64.exe"
debug/export_console_wrapper=0
binary_format/embed_pck=false
binary_format/architecture="x86_64"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
codesign/enable=false
application/modify_resources=false
dotnet/include_scripts_content=false
dotnet/include_debug_symbols=false
dotnet/embed_build_outputs=false

